[package]
name = "em-crypto"
version = "0.1.0"
description = "Cryptographic primitives for the unified-wifi-mesh Rust port (AES-SIV, key wrap, KDFs, DH group 5, EC, encodings)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# `rand::SeededRandom`, a deterministic byte stream for replay tests. For tests only: enable it
# only from `[dev-dependencies]`, never in a normal dependency entry.
test-random = []

# Every version is pinned with `=` and every feature list is explicit (note 0006 D2).
# Features that would pull in an OS random generator (`getrandom`, `std`) are left off on
# the crates below: all randomness comes from `em_crypto::rand`. `getrandom` itself is used
# only by `rand::OsRandom`.
[dependencies]
# Symmetric primitives. `zeroize` wipes the AES key schedules.
aes = { version = "=0.8.4", features = ["zeroize"] }
aes-siv = { version = "=0.7.0", default-features = false, features = ["alloc"] }
aes-kw = { version = "=0.2.1", default-features = false, features = ["alloc"] }
cbc = { version = "=0.1.2", default-features = false, features = ["alloc", "block-padding", "zeroize"] }
# Hashes, MACs and KDFs.
sha1 = { version = "=0.10.6", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
hmac = { version = "=0.12.1", default-features = false }
hkdf = { version = "=0.12.4", default-features = false }
pbkdf2 = { version = "=0.12.2", default-features = false, features = ["hmac"] }
# Elliptic curves (used by the `ec` module).
elliptic-curve = { version = "=0.13.8", default-features = false, features = ["alloc", "arithmetic", "sec1", "pkcs8", "ecdh"] }
p256 = { version = "=0.13.2", default-features = false, features = ["alloc", "arithmetic", "ecdsa", "ecdh", "pkcs8"] }
p384 = { version = "=0.13.1", default-features = false, features = ["alloc", "arithmetic", "ecdsa", "ecdh", "pkcs8"] }
p521 = { version = "=0.13.3", default-features = false, features = ["alloc", "arithmetic", "ecdsa", "ecdh", "pkcs8"] }
ecdsa = { version = "=0.16.9", default-features = false, features = ["alloc", "der", "signing", "verifying"] }
spki = { version = "=0.7.3", default-features = false, features = ["alloc"] }
der = { version = "=0.7.10", default-features = false, features = ["alloc"] }
# Big integers (DH group 5; EC scalars via elliptic-curve).
crypto-bigint = { version = "=0.5.5", default-features = false, features = ["zeroize"] }
# Encodings, constant time, secret wiping, randomness.
base64ct = { version = "=1.6.0", default-features = false, features = ["alloc"] }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.8.1", default-features = false, features = ["alloc"] }
getrandom = { version = "=0.2.15", default-features = false }
