[package]
name = "em-agent"
version = "0.1.0"
description = "EasyMesh agent role actor and core for the unified-wifi-mesh Rust port."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
em-types = { path = "../em-types" }
em-msg = { path = "../em-msg" }
em-cmd = { path = "../em-cmd" }
em-orch = { path = "../em-orch" }
em-core = { path = "../em-core" }
em-crypto = { path = "../em-crypto" }
em-transport = { path = "../em-transport" }
em-event-loop = { path = "../em-event-loop" }
em-utils = { path = "../em-utils" }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "signal", "macros", "time", "sync"] }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }

[dev-dependencies]
# The seeded random source for the replay tests (0016 D8 step 6); never in [dependencies].
em-crypto = { path = "../em-crypto", features = ["test-random"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "time", "sync", "net", "io-util", "test-util"] }

[lints]
workspace = true
